# Builds the operator agent from a source checkout (the generated `compose.yaml` from
# `fh-toolkit init` runs the published image instead, and is what operators use):
#   docker compose -f docker-compose.operator.yml --profile agent up -d --build
#
# Builds from the REPO ROOT context (protocol/ + arcane-mage/ in scope). Fill
# .env.operator (see .env.operator.example); never commit it.
#
# The Coalition is not here: it runs as a Flux App from the published image
# (operator-onboarding.md Step 4). Its old self-hosted service, published on :8088
# behind a fluxapp-staging Caddy vhost, was removed 2026-10-15.
name: moltentech-operator

services:
  # Outbound-only provisioning agent. Holds the LOCAL Proxmox creds; no inbound ports.
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: ./agent/Dockerfile
    # No container_name: Compose names it <project>-agent-1 so multiple operator
    # stacks (e.g. prod + a staging instance via -p) coexist without a collision.
    restart: unless-stopped
    env_file: [.env.operator]
    # No published ports — the agent only dials out (MT 443 + local Proxmox :8006).
