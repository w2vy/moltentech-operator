<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fh-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b61d1"/><stop offset="1" stop-color="#4b7fe0"/>
    </linearGradient>
    <linearGradient id="fh-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6000"/><stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="fh-cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b61d1"/><stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
  </defs>
  <!-- Flux Hub icon: two-tone "H" (Flux blue + Hub orange) on a dark badge -->
  <rect width="32" height="32" rx="6" fill="#111214"/>
  <rect x="1" y="1" width="30" height="30" rx="5.4" fill="none" stroke="#2b61d1" stroke-width=".9" opacity=".5"/>
  <rect x="9.6" y="8.4" width="4.1" height="15.2" rx="1" fill="url(#fh-blue)"/>
  <rect x="18.3" y="8.4" width="4.1" height="15.2" rx="1" fill="url(#fh-orange)"/>
  <rect x="9.6" y="13.95" width="12.8" height="4.1" fill="url(#fh-cross)"/>
</svg>
