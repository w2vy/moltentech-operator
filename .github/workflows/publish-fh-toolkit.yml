name: Publish fh-toolkit

# `ghcr.io/w2vy/fh-toolkit` is what operators actually run — they pull the image, they
# do not build from source. Before this workflow it was pushed by hand, so a merged
# protocol change could leave every operator on a stale CLI that rejects the current
# config.env format. That happened once, mid-signing-ceremony. Now any protocol change
# that lands on master republishes the image. Trunk only — a protocol change on
# staging is not yet something operators should be pulling.
#
# Tags: `latest` (what the documented alias pulls) and the commit SHA (so a bad publish
# can be rolled back to a known-good image without rebuilding).

on:
  push:
    branches: [master]
    paths:
      - "protocol/**"
      - ".github/workflows/publish-fh-toolkit.yml"
  workflow_dispatch: # manual re-publish, e.g. after a rollback

concurrency:
  group: publish-fh-toolkit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build time as a fact about THIS build, not about the repository. (The tempting
      # `github.event.repository.updated_at` is neither, and is absent on dispatch.)
      - id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: protocol
          file: protocol/Dockerfile
          push: true
          # Baked in so `fh-toolkit version` names the commit it was built from. An
          # operator's image refreshes at most every 48h, so "merged" and "running" are
          # different claims and this is what separates them.
          build-args: |
            FH_BUILD_SHA=${{ github.sha }}
            FH_BUILD_TIME=${{ steps.stamp.outputs.at }}
          tags: |
            ghcr.io/w2vy/fh-toolkit:latest
            ghcr.io/w2vy/fh-toolkit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the tag we just published (not the local build cache) and confirm it can
      # actually sign — a published-but-broken CLI is the failure this whole workflow
      # exists to prevent.
      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          docker rmi ghcr.io/w2vy/fh-toolkit:latest 2>/dev/null || true
          docker pull ghcr.io/w2vy/fh-toolkit:latest
          work="$(mktemp -d)"
          cat > "$work/config.env" <<'EOF'
          PROVIDER_SLUG=ci-operator
          PROVIDER_NAME=CI Operator
          COALITION_URL=https://coalition.example
          HOSTS=pve-01,pve-02
          TIER_PRICES_JSON={"cumulus":700,"nimbus":20000}
          TRIAL_DAYS=1
          EOF
          run() { docker run --rm -v "$work:/work" -u "$(id -u):$(id -g)" ghcr.io/w2vy/fh-toolkit:latest "$@"; }
          run keygen
          run sign --key manifest-key.pem --from-config config.env --out manifest.json
          run verify --in manifest.json
          # No command and no TTY must SAY so. The published image opens an interactive
          # session when it gets neither, and a session that reads EOF and vanishes is
          # exactly the silent half-broken failure the -t guard exists to prevent.
          if run > "$work/noargs.txt" 2>&1; then
            echo "expected a non-zero exit when given no command"; cat "$work/noargs.txt"; exit 1
          fi
          grep -q "not a terminal" "$work/noargs.txt"
          # The build args actually reached the image: a `version` that cannot name its
          # own commit is worse than none, because it reads as authoritative.
          docker run --rm ghcr.io/w2vy/fh-toolkit:latest version | tee /dev/stderr | grep -q "$GITHUB_SHA"
          python3 - "$work/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          assert "tiers" not in m and [h["name"] for h in m["hardware"]] == ["pve-01", "pve-02"]
          print("published image signs correctly")
          PY
